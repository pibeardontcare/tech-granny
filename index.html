<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nana's XR News</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  
  

  <!-- NEWS PANEL -->
<div id="newsPanel">
  <button id="hideNewsPanel" class="panel-action">Hide News</button>

  <div id="status">Fetching the latest news…</div>
  <div id="headlines"></div>
</div>

<!-- TOGGLE BUTTON (shown when panel is hidden) -->
<button id="showNewsPanel"> </button>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  
<script type="module" src="public/src/main.js"></script>

<div id="controls" style="position:absolute; bottom:0; left:0; width:100%; background:#fff; padding:1rem; display:flex; justify-content:center; gap:1rem;">

  <button id="readAllWithGoogle">🔊 Read All</button>

  <button id="toggleVoiceBtn">🧠 Voice: ElevenLabs</button>

 <button id="togglePlayBtn">▶️ Play</button>

</div>
</body>

</html>
