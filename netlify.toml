[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Only keep externals your functions actually import and want unbundled
  external_node_modules = ["jsdom", "@mozilla/readability"]
  included_files = [
    "node_modules/jsdom/**",
    "node_modules/@mozilla/readability/**"
  ]


[functions."nana_explain"]
  timeout = 20


[[redirects]]
  from = "/articles"
  to = "/.netlify/functions/articles"
  status = 200


[dev]
  framework = "#static"
